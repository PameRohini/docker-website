name: Docker CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: pamerohini/docker-website

jobs:
  build-and-publish:
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
  deploy-to-kubernetes:
    needs: build-and-publish
    runs-on: ubuntu-latest

    permissions:
      contents: read
      packages: read

    steps:
      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull published Docker image
        run: docker pull ghcr.io/pamerohini/docker-website:latest

      - name: Install kind
        run: |
          curl -Lo ./kind https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64
          chmod +x ./kind
          sudo mv ./kind /usr/local/bin/kind

      - name: Create Kubernetes cluster
        run: kind create cluster --wait 60s

      - name: Load Docker image into Kubernetes
        run: |
          docker tag ghcr.io/pamerohini/docker-website:latest rohini-website:ci
          kind load docker-image rohini-website:ci

      - name: Deploy application
        run: |
          cat > deployment.yaml <<'EOF'
          apiVersion: apps/v1
          kind: Deployment
          metadata:
            name: rohini-website
          spec:
            replicas: 2
            selector:
              matchLabels:
                app: rohini-website
            template:
              metadata:
                labels:
                  app: rohini-website
              spec:
                containers:
                  - name: website
                    image: rohini-website:ci
                    imagePullPolicy: IfNotPresent
                    ports:
                      - containerPort: 80
          ---
          apiVersion: v1
          kind: Service
          metadata:
            name: rohini-website-service
          spec:
            selector:
              app: rohini-website
            ports:
              - port: 80
                targetPort: 80
          EOF

          kubectl apply -f deployment.yaml
          kubectl rollout status deployment/rohini-website --timeout=120s

      - name: Test Kubernetes deployment
        run: |
          kubectl get pods
          kubectl get services
          kubectl port-forward service/rohini-website-service 8085:80 >/tmp/port-forward.log 2>&1 &
          PF_PID=$!
          sleep 5
          curl -fsS http://127.0.0.1:8085/ > /tmp/site.html
          grep -q "Hello Rohini" /tmp/site.html
          kill $PF_PID